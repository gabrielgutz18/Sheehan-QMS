# optional: serve the app on port 80 (http://<server-ip>, no :3000) through nginx
# install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/sheehan-queue
#          sudo ln -s /etc/nginx/sites-available/sheehan-queue /etc/nginx/sites-enabled/
#          sudo rm /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    server_name _;

    # Admin → Display video uploads go up to 200 MB (MAX_VIDEO_BYTES in server/api.js)
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # stream uploads straight to the app instead of buffering them on disk first
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
