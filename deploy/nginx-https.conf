# HTTPS for the app, in place of deploy/nginx.conf: https://<server> serves it, and every http:// address is sent on
# to https://, so nothing goes over plain http
# needs the certificate first; install:
#          sudo bash deploy/make-certs.sh
#          sudo cp deploy/nginx-https.conf /etc/nginx/sites-available/sheehan-queue
#          sudo ln -sf /etc/nginx/sites-available/sheehan-queue /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx

# plain http: only the shop's certificate authority, for a device that doesn't trust it yet; anything else is sent
# on to the same address over https
server {
    listen 80 default_server;
    server_name _;

    location = /sheehan-ca.crt {
        alias /etc/ssl/sheehan-queue/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    # made by deploy/make-certs.sh
    ssl_certificate     /etc/ssl/sheehan-queue/server.crt;
    ssl_certificate_key /etc/ssl/sheehan-queue/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Admin → Display video uploads go up to 200 MB (MAX_VIDEO_BYTES in server/api.js)
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # "https": the app marks the sign-in cookie Secure, so the browser never sends it over plain http
        proxy_set_header X-Forwarded-Proto $scheme;
        # stream uploads straight to the app instead of buffering them on disk first
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
