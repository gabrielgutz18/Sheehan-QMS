name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new commit cancels a pull request's older run; master runs wait their turn instead,
# so a deploy to the server is never cut off halfway through a build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # GitHub Pages serves the site at /<repo-name>/, so set Vite's base path accordingly
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: SPA fallback
        # Pages has no server-side rewrites; serving index.html as 404.html lets deep links like /admin load the app
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-server:
    name: Deploy to the Ubuntu server
    needs: ci
    # master only, never pull requests: this job runs on the office server itself (a self-hosted runner,
    # see DEPLOY-UBUNTU.md); skipped until the DEPLOY_SERVER repository variable is set to true
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.DEPLOY_SERVER == 'true'
    runs-on: [self-hosted, linux, sheehan-server]
    timeout-minutes: 15
    steps:
      - name: Back up, pull, build and restart
        # the server's own clone, the one the sheehan-queue service runs; it pulls master itself
        run: bash /opt/sheehan-queue/deploy/update.sh master
