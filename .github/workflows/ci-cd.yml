name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new commit cancels a pull request's older run; master runs wait their turn instead,
# so a deploy to the server is never cut off halfway through a build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # the same version as the server (docs/DEPLOY-UBUNTU.md)
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy-server:
    name: Deploy to the Ubuntu server
    needs: ci
    # master only, never pull requests: this job runs on the office server itself (a self-hosted runner,
    # see docs/DEPLOY-UBUNTU.md); skipped until the DEPLOY_SERVER repository variable is set to true
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.DEPLOY_SERVER == 'true'
    runs-on: [self-hosted, linux, sheehan-server]
    timeout-minutes: 15
    steps:
      - name: Back up, pull, build and restart
        # the server's own clone, the one the sheehan-queue service runs; it pulls master itself
        run: bash /opt/sheehan-queue/deploy/update.sh master
