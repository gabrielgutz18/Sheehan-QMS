# weekly pull requests for outdated packages; CI tests each one before it can be merged
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # routine updates arrive together; a major version gets a pull request of its own
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /tools/print-service
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
